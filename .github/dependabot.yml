version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 5 * * *"
      timezone: "Etc/GMT+3"
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
        - "github/*"
    labels:
      - "dependencies"
      - "GitHub Actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 5 * * *"
      timezone: "Etc/GMT+3"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: increase
    rebase-strategy: auto
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
