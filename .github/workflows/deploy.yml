name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, migrate, and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    permissions:
      contents: read # Read the exact source revision being deployed.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate application
        run: |
          npm run biome
          npm run check

      - name: Reject a stale deployment revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(
            gh api \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"

          if [[ "${current_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error title=Stale deployment blocked::Expected ${EXPECTED_SHA}, but main points to ${current_sha}."
            exit 1
          fi

      - name: Apply D1 migrations and deploy with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          preCommands: wrangler d1 migrations apply bigdata_db --remote --config wrangler.json
          command: >-
            deploy --strict --config wrangler.json
            --tag ${{ github.sha }}
            --message "GitHub Actions run ${{ github.run_id }} for ${{ github.sha }}"
